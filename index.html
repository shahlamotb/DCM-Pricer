<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCM Pricer</title>
<meta name="theme-color" content="#0A1F1B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  /* ===== COLOURS: edit the hex codes below to restyle the page ===== */
  /* Dark theme (default) */
  --bg: #0A1F1B;          /* page background */
  --surface: #10302A;     /* cards, boxes */
  --ink: #F3EFE4;         /* main text (off-white) */
  --muted: #A3B8B1;       /* secondary text */
  --line: #23473F;        /* thin borders */
  --accent: #C3984D;      /* main accent (gold) */
  --accent-soft: #1D3D33; /* highlight background */
  --on-accent: #0A1F1B;   /* text on top of the accent colour */
  --green: #5DBBA3;       /* third colour */
  --down: #E58F7E;        /* negative moves */
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* Light theme (shown when the Theme button is tapped) */
:root[data-theme="light"] {
  --bg: #F6F3EA; --surface: #FFFFFF; --ink: #0F2E28; --muted: #5E746D; --line: #DDD8C8;
  --accent: #00604F; --accent-soft: #DCE9E3; --on-accent: #FFFFFF; --green: #A27A32; --down: #B3402F;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, select { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; }

/* ---- top bar + selection area (Excel B3:F4) ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px 12px; }
.top .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.title { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: .01em; }
.src { color: var(--muted); font-size: 12px; }
.src b { color: var(--accent); font-weight: 600; }
.theme { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; flex: 0 0 auto; }
.sel { display: grid; grid-template-columns: 1.25fr 1fr .8fr; gap: 8px; }
.sel label { display: grid; gap: 3px; font-size: 11.5px; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; }
.sel select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 8px; font-size: 15px; font-weight: 600; color: var(--ink); text-transform: none; letter-spacing: 0; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 24px; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- cards ---- */
main { padding: 14px 16px 44px; display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.card h2 { font-family: var(--serif); font-size: 16px; font-weight: 600; margin: 0 0 2px; line-height: 1.25; }
.sub { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }

/* headline (Excel B6:B8) */
.hl-title { font-size: 13px; color: var(--muted); }
.hl-fv { font-weight: 600; margin-top: 2px; }
.quote { font-family: var(--serif); font-weight: 600; font-size: 56px; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; margin: 6px 0 0; }
.quote .t { font-weight: 400; color: var(--muted); font-size: .62em; margin-right: 2px; }
.quote .u { font-family: var(--sans); font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }

/* pricing summary (Excel Q5:R11) */
table.kv { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.kv td { padding: 8px 0; border-top: 1px solid var(--line); }
table.kv tr:first-child td { border-top: 0; }
table.kv td:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
table.kv tr.em td { color: var(--accent); }
table.kv tr.em td:first-child { color: var(--ink); }
table.kv small { color: var(--muted); font-weight: 400; }

/* assumptions */
.assume { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.step { display: grid; gap: 5px; }
.step label { font-size: 12.5px; color: var(--muted); }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
.stepper button { border: 0; background: transparent; width: 42px; height: 38px; font-size: 20px; cursor: pointer; }
.stepper output { flex: 1; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-weight: 500; font-size: 13.5px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.full { grid-column: 1 / -1; }
.reset { margin-top: 8px; border: 0; background: transparent; color: var(--accent); font-weight: 500; padding: 4px 0; cursor: pointer; }

/* charts */
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--sans); fill: var(--muted); font-size: 11px; }
svg text.v { fill: var(--ink); font-weight: 600; font-size: 12px; }
svg .grid { stroke: var(--line); }
.note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.callout { display: flex; gap: 14px; flex-wrap: wrap; margin: 4px 0 8px; }
.callout div { display: grid; }
.callout b { font-family: var(--serif); font-size: 21px; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.callout span { color: var(--muted); font-size: 12px; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-weight: 500; padding: 4px 0; font-size: 13.5px; }
table.refs { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
table.refs th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 0; font-size: 12px; }
table.refs th:not(:first-child), table.refs td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
table.refs td { padding: 5px 0; border-top: 1px solid var(--line); }
table.refs td:first-child { padding-right: 8px; }

/* comps (Excel "Comps Issuers") */
.comps { display: grid; gap: 7px; }
.crow { display: grid; grid-template-columns: 70px 1fr 40px; align-items: center; gap: 8px; border: 0; background: transparent; padding: 3px 0; text-align: left; cursor: pointer; }
.crow .nm { font-size: 13.5px; font-weight: 500; }
.crow .bar { height: 14px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.crow .bar i { position: absolute; inset: 0 auto 0 0; background: var(--green); border-radius: 3px; }
.crow.me .bar i { background: var(--accent); }
.crow.me .nm { color: var(--accent); }
.mrow { display: grid; grid-template-columns: 112px 1fr 38px; align-items: center; gap: 8px; padding: 4px 0; }
.mrow .nm { font-size: 13.5px; }
.mrow .bar { height: 14px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.mrow .bar i { position: absolute; inset: 0 auto 0 0; background: var(--green); border-radius: 3px; }
.mrow.avg .bar i { background: var(--accent); }
.mrow.avg .nm { color: var(--accent); font-weight: 600; }
.mrow .val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13.5px; }
.mrow.na .val { color: var(--muted); font-weight: 400; }
.crow .val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13.5px; }
.empty { color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; text-align: center; }
.foot b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="head">
      <div>
        <div class="title">DCM Pricer</div>
        <div class="src" id="src"></div>
      </div>
      <button class="theme" id="themeBtn" aria-label="Switch light or dark theme">Theme</button>
    </div>
    <div class="sel">
      <label>Issuer<select id="selIssuer" aria-label="Issuer"></select></label>
      <label>Issuance type<select id="selType" aria-label="Issuance type"></select></label>
      <label>Tenor<select id="selTenor" aria-label="Tenor"></select></label>
    </div>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<script src="data.js"></script>
<script>
/* =====================================================================
   SETTINGS: edit these to change what the page shows.
   The numbers themselves live in data.js (written by the Excel macro).
   ===================================================================== */

// Issuers in the drop-down, in the same order as the Excel list.
const ISSUERS = ['PIF', 'Aramco', 'SECO', 'STC', 'Avilease', 'Maaden', 'SRC'];

// Which curve each issuer is priced off. KSA is the benchmark itself.
const BENCHMARK = { PIF: 'KSA', Aramco: 'KSA', SECO: 'KSA', STC: 'KSA', SRC: 'KSA', Avilease: 'PIF', Maaden: 'PIF' };

// Issuers shown in the "Comps issuers" box (KSA is included as the benchmark).
const COMPS = ['KSA', 'PIF', 'Aramco', 'SECO', 'STC', 'Avilease', 'Maaden', 'SRC'];

const TYPES = ['Bond', 'Sukuk'];
const TENORS = ['3', '5', '7', '10', '30'];
const STEP = 5;                 // size of the +/- buttons
const ROUND_TO = 5;             // method values are rounded to the nearest 5 bps, as in Excel
const BOND_TO_SUKUK = ['PIF', 'Aramco'];   // issuers that show the "FV from bond curve" box
const METHOD_LABELS = [         // [name in data.js, label on screen]
  ['Interpolation', 'Interpolation'],
  ['Extrapolation (Lower)', 'Extrapolation'],
  ['Curve Extension', 'Curve extension'],
  ['Curve Reduction', 'Curve reduction']
];
/* ===================== end of settings ===================== */

const state = {
  issuer: 'PIF', type: 'Sukuk', tenor: '5',
  nip: DATA.nip, discount: DATA.sukukDiscount,
  pifMode: DATA.pifMode === 'Manual' ? 'Manual' : 'Secondaries', pifDelta: DATA.pifManualDelta
};
try {
  const s = JSON.parse(localStorage.getItem('dcm-pricer-state') || 'null');
  if (s && ISSUERS.includes(s.issuer) && TYPES.includes(s.type) && TENORS.includes(s.tenor)) { state.issuer = s.issuer; state.type = s.type; state.tenor = s.tenor; }
} catch (e) {}

const $ = (id) => document.getElementById(id);
const r5 = (x) => Math.round(x / ROUND_TO) * ROUND_TO;
const sgn = (x) => (x >= 0 ? '+' : '\u2212') + Math.abs(x);
const kv = (a, b, cls) => `<tr class="${cls || ''}"><td>${a}</td><td>${b}</td></tr>`;

/* ---------- model logic ---------- */
function fixedFV(iss, type, t) {
  const v = DATA.fixed[iss] && DATA.fixed[iss][type] ? DATA.fixed[iss][type][t] : null;
  return v == null ? null : v;
}
// PIF can run in "Manual" mode: KSA FV + a manual delta (as in the Excel INPUTS sheet)
function fvOf(iss, type, t) {
  if (iss === 'PIF' && state.pifMode === 'Manual') {
    const k = fixedFV('KSA', type, t);
    return k == null ? null : k + state.pifDelta;
  }
  return fixedFV(iss, type, t);
}
function calc(iss, type, t) {
  const fv = fvOf(iss, type, t);
  if (fv == null) return null;
  const b = BENCHMARK[iss] || null;
  const bfv = b ? fvOf(b, type, t) : null;
  const offer = fv + state.nip;
  return { fv, b, bfv, delta: (b && bfv != null) ? fv - bfv : null, nip: state.nip, offer, yld: DATA.ust[t] + offer / 100 };
}
const typesOf = (iss) => TYPES.filter((ty) => DATA.fixed[iss] && DATA.fixed[iss][ty]);
const tenorsOf = (iss, ty) => TENORS.filter((t) => fixedFV(iss, ty, t) != null);
function normalise() {
  if (!typesOf(state.issuer).includes(state.type)) state.type = typesOf(state.issuer)[0] || state.type;
  const ok = tenorsOf(state.issuer, state.type);
  if (ok.length && !ok.includes(state.tenor)) {
    const want = Number(state.tenor);
    state.tenor = ok.reduce((a, b) => Math.abs(Number(b) - want) < Math.abs(Number(a) - want) ? b : a);
  }
}

/* ---------- SVG helpers ---------- */
function wrap(label, n) {
  const w = label.split(' '), out = []; let cur = '';
  w.forEach((x) => { if ((cur + ' ' + x).trim().length > n && cur) { out.push(cur); cur = x; } else cur = (cur + ' ' + x).trim(); });
  if (cur) out.push(cur);
  return out;
}
function labelLines(x, y, label, n) {
  return wrap(label, n).map((ln, i) => `<text x="${x}" y="${y + i * 13}" text-anchor="middle">${ln}</text>`).join('');
}
// steps: [{label, value, kind: 'total' | 'delta'}]
function waterfall(steps) {
  const W = 340, H = 200, T = 22, B = 44, L = 6, R = 6;
  let cum = 0; const bars = [];
  steps.forEach((s) => {
    if (s.kind === 'total') { bars.push({ ...s, from: 0, to: s.value }); cum = s.value; }
    else { bars.push({ ...s, from: cum, to: cum + s.value }); cum += s.value; }
  });
  const max = Math.max(...bars.map((b) => Math.max(b.from, b.to))) * 1.12 || 1;
  const n = bars.length, slot = (W - L - R) / n, bw = Math.min(54, slot - 14);
  const y = (v) => T + (1 - v / max) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${steps.map((b) => b.label + ' ' + b.value).join(', ')}">`;
  s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  bars.forEach((b, i) => {
    const cx = L + slot * i + slot / 2, x0 = cx - bw / 2;
    const top = Math.min(y(b.from), y(b.to)), h = Math.max(Math.abs(y(b.from) - y(b.to)), 1.5);
    const fill = b.kind === 'total' ? (i === n - 1 ? 'var(--accent)' : 'var(--ink)') : (b.value < 0 ? 'var(--down)' : 'var(--green)');
    s += `<rect x="${x0}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${fill}"/>`;
    if (i < n - 1) s += `<line x1="${x0 + bw}" x2="${x0 + slot}" y1="${y(b.to)}" y2="${y(b.to)}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
    const txt = b.kind === 'total' ? `${b.value}` : sgn(b.value);
    s += `<text class="v" x="${cx}" y="${top - 5}" text-anchor="middle">${txt} bps</text>`;
    s += labelLines(cx, H - B + 15, b.label, 13);
  });
  return s + '</svg>';
}
// items: [{label, value|null, strong}]
function columns(items) {
  const W = 340, H = 200, T = 22, B = 44, L = 6, R = 6;
  const vals = items.map((i) => i.value).filter((v) => v != null);
  const max = Math.max(...vals, 1) * 1.12;
  const n = items.length, slot = (W - L - R) / n, bw = Math.min(46, slot - 12);
  const y = (v) => T + (1 - v / max) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${items.map((i) => i.label + ' ' + (i.value == null ? 'not available' : i.value)).join(', ')}">`;
  s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  items.forEach((it, i) => {
    const cx = L + slot * i + slot / 2;
    if (it.value == null) {
      s += `<text class="v" x="${cx}" y="${y(0) - 6}" text-anchor="middle" style="fill:var(--muted)">NA</text>`;
    } else {
      s += `<rect x="${cx - bw / 2}" y="${y(it.value)}" width="${bw}" height="${y(0) - y(it.value)}" rx="3" fill="${it.strong ? 'var(--accent)' : 'var(--green)'}"/>`;
      s += `<text class="v" x="${cx}" y="${y(it.value) - 5}" text-anchor="middle">${it.value}</text>`;
    }
    s += labelLines(cx, H - B + 15, it.label, 11);
  });
  return s + '</svg>';
}
function methodRows(items) {
  const max = Math.max(...items.map((i) => i.value || 0), 1) * 1.08;
  return items.map((it) => `<div class="mrow ${it.strong ? 'avg' : ''} ${it.value == null ? 'na' : ''}"><span class="nm">${it.label}</span><span class="bar">${it.value == null ? '' : `<i style="width:${(it.value / max * 100).toFixed(1)}%"></i>`}</span><span class="val">${it.value == null ? 'NA' : it.value}</span></div>`).join('');
}
function curveChart(iss, type, b) {
  const own = TENORS.map((t) => fvOf(iss, type, t));
  const ben = b ? TENORS.map((t) => fvOf(b, type, t)) : TENORS.map(() => null);
  const all = own.concat(ben).filter((v) => v != null);
  const lo = Math.floor((Math.min(...all) - 10) / 20) * 20, hi = Math.ceil((Math.max(...all) + 10) / 20) * 20;
  const W = 340, H = 190, L = 30, R = 14, T = 14, B = 28;
  const x = (i) => L + i * ((W - L - R) / (TENORS.length - 1));
  const y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  const si = TENORS.indexOf(state.tenor);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="FV by tenor">`;
  for (let v = lo; v <= hi; v += 20) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  s += `<rect x="${x(si) - 15}" y="${T - 4}" width="30" height="${H - T - B + 8}" rx="4" fill="var(--accent-soft)"/>`;
  const path = (arr) => { let d = '', pen = false; arr.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i)} ${y(v)} `; pen = true; }); return d; };
  if (b) s += `<path d="${path(ben)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s += `<path d="${path(own)}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
  TENORS.forEach((t, i) => {
    if (b && ben[i] != null) s += `<circle cx="${x(i)}" cy="${y(ben[i])}" r="3.5" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.8"/>`;
    if (own[i] != null) {
      s += `<circle cx="${x(i)}" cy="${y(own[i])}" r="${i === si ? 5.5 : 4}" fill="var(--accent)"/>`;
      if (i === si) s += `<text class="v" x="${x(i)}" y="${y(own[i]) - 10}" text-anchor="middle">${own[i]}</text>`;
    }
    s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" style="${i === si ? 'fill:var(--ink);font-weight:600' : ''}">${t}Y</text>`;
    s += `<rect class="hit" data-t="${t}" x="${x(i) - 22}" y="0" width="44" height="${H}" fill="transparent" style="cursor:pointer"/>`;
  });
  return s + '</svg>';
}

/* ---------- sections (same order as the Excel dashboard) ---------- */
function headlineCard(c) {
  const { issuer: iss, type, tenor: t } = state;
  if (!c) return `<section class="card"><div class="hl-title">${iss} ${t}Y ${type} Offering Indicative Pricing</div><p class="empty" style="margin:10px 0 0">The model has no ${iss} ${type.toLowerCase()} fair value at ${t}Y, so there is no quote for this selection.</p></section>`;
  return `<section class="card">
    <div class="hl-title">${iss} ${t}Y ${type} Offering Indicative Pricing [Including NIP]</div>
    <div class="hl-fv">${iss} ${t}Y ${type} FV</div>
    <div class="quote"><span class="t">T+</span>${c.offer}<span class="u">bps</span></div>
  </section>`;
}
function summaryCard(c) {
  if (!c) return '';
  const { issuer: iss, tenor: t } = state;
  const rows = [kv('Tenor', t + 'Y')];
  if (c.b) rows.push(kv(`${c.b} FV`, c.bfv == null ? 'NA' : c.bfv + ' bps'));
  rows.push(kv('New Issue Premium', state.nip + ' bps'));
  rows.push(kv(`${iss} FV`, c.fv + ' bps'));
  if (c.b && c.delta != null) rows.push(kv(`Delta vs. ${c.b}`, sgn(c.delta) + ' bps'));
  rows.push(kv('Re-offer Yield', c.yld.toFixed(2) + '%', 'em'));
  return `<section class="card"><h2>Pricing Summary</h2><p class="sub">US Treasury ${t}Y: ${DATA.ust[t].toFixed(2)}%. Re-offer yield = Treasury + FV + NIP.</p><table class="kv"><tbody>${rows.join('')}</tbody></table></section>`;
}
function assumptionsCard() {
  const iss = state.issuer, usesPif = iss === 'PIF' || BENCHMARK[iss] === 'PIF';
  const showDisc = BOND_TO_SUKUK.includes(iss) && state.type === 'Sukuk';
  const changed = state.nip !== DATA.nip || state.discount !== DATA.sukukDiscount || state.pifDelta !== DATA.pifManualDelta || state.pifMode !== (DATA.pifMode === 'Manual' ? 'Manual' : 'Secondaries');
  const stepper = (k, label) => `<div class="step"><label>${label}</label><div class="stepper"><button type="button" data-k="${k}" data-d="-${STEP}" aria-label="Decrease">\u2212</button><output>${state[k]}</output><button type="button" data-k="${k}" data-d="${STEP}" aria-label="Increase">+</button></div></div>`;
  return `<section class="card"><h2>Assumptions</h2><p class="sub">Same inputs as the Excel INPUTS sheet. Change them to see the quote move.</p>
    <div class="assume">
      ${stepper('nip', 'New Issue Premium (bps)')}
      ${showDisc ? stepper('discount', 'Sukuk Discount (bps)') : ''}
      ${usesPif ? `<div class="step full"><label>PIF delta mode</label><div class="seg" role="group" aria-label="PIF delta mode"><button type="button" data-mode="Secondaries" aria-pressed="${state.pifMode === 'Secondaries'}">Secondaries</button><button type="button" data-mode="Manual" aria-pressed="${state.pifMode === 'Manual'}">Manual (KSA + delta)</button></div></div>` : ''}
      ${usesPif && state.pifMode === 'Manual' ? stepper('pifDelta', 'PIF manual delta vs. KSA (bps)') : ''}
    </div>
    ${changed ? '<button class="reset" type="button" id="reset">Reset to Excel values</button>' : ''}
  </section>`;
}
function blocksCard(c) {
  if (!c) return '';
  const { issuer: iss, tenor: t } = state;
  const steps = [];
  if (c.b && c.bfv != null) { steps.push({ label: `${c.b} ${t}Y FV`, value: c.bfv, kind: 'total' }); if (c.delta != null) steps.push({ label: `Delta vs. ${c.b}`, value: c.delta, kind: 'delta' }); }
  else steps.push({ label: `${iss} ${t}Y FV`, value: c.fv, kind: 'total' });
  steps.push({ label: 'New Issue Premium', value: state.nip, kind: 'delta' });
  steps.push({ label: 'Offer', value: c.offer, kind: 'total' });
  return `<section class="card"><h2>${iss} ${t}Y Building Blocks</h2><p class="sub">*After normalizing the secondary curves</p>${waterfall(steps)}</section>`;
}
function ownCurveCard(c) {
  const { issuer: iss, type, tenor: t } = state;
  const blk = DATA.blocks[iss] && DATA.blocks[iss][type] && DATA.blocks[iss][type][t];
  if (!blk || blk.avg == null) return '';
  const items = [{ label: 'Avg. all methods', value: r5(blk.avg), strong: true }]
    .concat(METHOD_LABELS.map(([k, lab]) => ({ label: lab, value: blk.methods[k] && blk.methods[k].value != null ? r5(blk.methods[k].value) : null })));
  const used = new Map();
  blk.refs.forEach((r) => used.set(r[0], r));
  Object.values(blk.methods).forEach((m) => m.used.forEach((r) => used.set(r[0], r)));
  const rows = [...used.values()].sort((a, b) => a[1] - b[1]).map((r) => `<tr><td>${r[0]}</td><td>${r[1].toFixed(1)}y</td><td>${r[2].toFixed(1)}</td></tr>`).join('');
  const adj = c && c.fv !== r5(blk.avg) && !(iss === 'PIF' && state.pifMode === 'Manual');
  return `<section class="card"><h2>${iss} ${t}Y FV from ${iss} ${type} Secondary Curve</h2>
    <p class="sub">Pricing methods on ${iss}'s own ${type.toLowerCase()} curve (rounded to ${ROUND_TO} bps).</p>
    ${c ? `<div class="callout"><div><b>${r5(blk.avg)}</b><span>Avg. all pricing methods</span></div><div><b>${c.fv}</b><span>Final FV${adj ? ' (curve-adjusted)' : ''}</span></div></div>` : ''}
    <div class="comps">${methodRows(items)}</div>
    <details><summary>Reference issues used (${used.size})</summary><table class="refs"><thead><tr><th>Issue</th><th>Tenor</th><th>G-spread</th></tr></thead><tbody>${rows}</tbody></table></details>
  </section>`;
}
function benchCurveCard(c) {
  if (!c || !c.b) return '';
  const { issuer: iss, type, tenor: t } = state;
  return `<section class="card"><h2>${iss} ${t}Y FV from ${c.b} ${type} Secondary Curve</h2>
    <p class="sub">${c.b} FV plus delta, by tenor. Tap a tenor to switch.</p>
    ${curveChart(iss, type, c.b)}
    <p class="note"><span style="color:var(--accent)">\u2501</span> ${iss} FV &nbsp; <span style="color:var(--muted)">\u2504</span> ${c.b} FV</p>
  </section>`;
}
function bondCurveCard(c) {
  const { issuer: iss, type, tenor: t } = state;
  if (!c || !BOND_TO_SUKUK.includes(iss) || type !== 'Sukuk' || t === '30') return '';
  const bb = DATA.blocks[iss] && DATA.blocks[iss].Bond && DATA.blocks[iss].Bond[t];
  if (!bb || bb.avg == null) return '';
  const bondFV = r5(bb.avg);
  const steps = [
    { label: `${iss} ${t}Y Bond FV`, value: bondFV, kind: 'total' },
    { label: 'Sukuk Discount', value: -state.discount, kind: 'delta' },
    { label: `${iss} ${t}Y Sukuk FV`, value: bondFV - state.discount, kind: 'total' }
  ];
  return `<section class="card"><h2>${iss} ${t}Y FV from ${iss} Bond Secondary Curve</h2><p class="sub">Cross-check: bond FV less the sukuk discount.</p>${waterfall(steps)}</section>`;
}
function compsCard() {
  const { issuer: iss, type, tenor: t } = state;
  const rows = COMPS.map((n) => ({ n, v: fvOf(n, type, t) })).filter((r) => r.v != null);
  if (!rows.length) return '';
  const max = Math.max(...rows.map((r) => r.v)) * 1.08;
  return `<section class="card"><h2>Comps Issuers</h2><p class="sub">${type} FV at ${t}Y. Tap an issuer to price it.</p>
    <div class="comps">${rows.map((r) => `<button type="button" class="crow ${r.n === iss ? 'me' : ''}" data-i="${r.n}"><span class="nm">${r.n}</span><span class="bar"><i style="width:${(r.v / max * 100).toFixed(1)}%"></i></span><span class="val">${r.v}</span></button>`).join('')}</div></section>`;
}

/* ---------- render ---------- */
function renderControls() {
  const si = $('selIssuer'), st = $('selType'), sn = $('selTenor');
  si.innerHTML = ISSUERS.map((i) => `<option value="${i}" ${i === state.issuer ? 'selected' : ''}>${i}</option>`).join('');
  const tOk = typesOf(state.issuer);
  st.innerHTML = TYPES.map((ty) => `<option value="${ty}" ${ty === state.type ? 'selected' : ''} ${tOk.includes(ty) ? '' : 'disabled'}>${ty}</option>`).join('');
  const nOk = tenorsOf(state.issuer, state.type);
  sn.innerHTML = TENORS.map((x) => `<option value="${x}" ${x === state.tenor ? 'selected' : ''} ${nOk.includes(x) ? '' : 'disabled'}>${x}Y</option>`).join('');
  $('src').innerHTML = `Source: <b>${DATA.source || 'Bloomberg'}</b>${DATA.asOf ? ' \u00b7 Data as of ' + DATA.asOf : ''}`;
}
function render() {
  const c = calc(state.issuer, state.type, state.tenor);
  $('app').innerHTML = headlineCard(c) + summaryCard(c) + assumptionsCard() + blocksCard(c) + ownCurveCard(c) + benchCurveCard(c) + bondCurveCard(c) + compsCard()
    + `<p class="foot">Source: <b>${DATA.source || 'Bloomberg'}</b>${DATA.asOf ? ' \u00b7 Data as of ' + DATA.asOf : ''}. Indicative pricing only.</p>`;
  document.querySelectorAll('.stepper button').forEach((b) => {
    b.onclick = () => {
      const k = b.dataset.k, d = Number(b.dataset.d);
      const lim = { nip: [-50, 100], discount: [0, 50], pifDelta: [-50, 100] }[k];
      state[k] = Math.max(lim[0], Math.min(lim[1], state[k] + d)); render();
    };
  });
  document.querySelectorAll('.seg button').forEach((b) => { b.onclick = () => { state.pifMode = b.dataset.mode; update(); }; });
  const rs = $('reset'); if (rs) rs.onclick = () => { state.nip = DATA.nip; state.discount = DATA.sukukDiscount; state.pifDelta = DATA.pifManualDelta; state.pifMode = DATA.pifMode === 'Manual' ? 'Manual' : 'Secondaries'; update(); };
  document.querySelectorAll('.hit').forEach((h) => { h.onclick = () => { if (fvOf(state.issuer, state.type, h.dataset.t) != null) { state.tenor = h.dataset.t; update(); } }; });
  document.querySelectorAll('.crow').forEach((b) => { b.onclick = () => { if (ISSUERS.includes(b.dataset.i)) { state.issuer = b.dataset.i; update(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }; });
}
function update() {
  normalise();
  try { localStorage.setItem('dcm-pricer-state', JSON.stringify({ issuer: state.issuer, type: state.type, tenor: state.tenor })); } catch (e) {}
  renderControls(); render();
}
$('selIssuer').onchange = (e) => { state.issuer = e.target.value; update(); };
$('selType').onchange = (e) => { state.type = e.target.value; update(); };
$('selTenor').onchange = (e) => { state.tenor = e.target.value; update(); };

/* theme toggle (remembers the last choice on this phone) */
(function () {
  const root = document.documentElement;
  try { const s = localStorage.getItem('dcm-theme'); if (s === 'light' || s === 'dark') root.setAttribute('data-theme', s); } catch (e) {}
  $('themeBtn').onclick = () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('dcm-theme', next); } catch (e) {}
  };
})();

update();
</script>
</body>
</html>
