<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCM Pricer</title>
<meta name="theme-color" content="#00483C">
<style>
:root {
  /* ===== COLOURS: copied from the Excel dashboard. Edit the hex codes to restyle. ===== */
  --bg: #00483C;          /* page background */
  --bg-dark: #00332A;     /* Pricing Summary header / labels */
  --bar-green: #00604F;   /* section title bars and the DCM Pricer title */
  --gold: #C3984D;        /* selected issuer, final result */
  --teal: #00A688;        /* benchmark / average bars */
  --mint: #02CC99;        /* comps bars */
  --grey: #A6A6A6;        /* pricing-method bars */
  --grey-light: #C4C4C4;  /* delta bar */
  --white: #FFFFFF;
  --band-left: #F3EBDD;   /* top band gradient */
  --band-mid: #E7D6B8;
  --band-right: #FCFAF7;
  --tan: #E4D0B0;        /* Issuer / Issuance Type / Tenor labels */
  --input: #D8D8D8;       /* drop-down boxes */
  --cell-a: #F2F2F2;      /* summary value cells */
  --cell-b: #D9D9D9;
  --ink: #00483C;
  --stale: #E0A030;
  --font: Calibri, Carlito, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--white); font-family: var(--font); font-size: 14px; line-height: 1.35; }
select, button { font: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- top band (Excel row 1) ---------- */
.band { background: linear-gradient(90deg, var(--band-left) 0%, var(--band-mid) 45%, var(--band-right) 100%); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; }
.band-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.band img { height: 44px; width: auto; display: block; }
.band h1 { margin: 0; font-size: 30px; font-weight: 500; color: var(--bar-green); letter-spacing: .01em; flex: 1 1 auto; }
.live { text-align: right; color: var(--ink); font-size: 12px; line-height: 1.3; }
.live b { font-weight: 700; }
.live .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--teal); margin-right: 5px; vertical-align: baseline; }
.live.stale .dot { background: var(--stale); }
.live.off .dot { background: #8a8a8a; }
.live button { border: 0; background: none; padding: 0; color: var(--bar-green); text-decoration: underline; cursor: pointer; font-size: 12px; }

.page { max-width: 1320px; margin: 0 auto; padding: 14px 16px 36px; }

/* ---------- selection area (Excel B3:F4) ---------- */
.sel { display: grid; grid-template-columns: 1.15fr 1.15fr .9fr; gap: 10px; max-width: 460px; margin-bottom: 14px; }
.sel label { display: grid; }
.sel span { background: linear-gradient(#EBDCC0, var(--tan)); color: var(--ink); font-weight: 700; font-size: 12.5px; text-align: center; padding: 2px 4px; letter-spacing: .03em; }
.sel select { width: 100%; border: 0; border-radius: 0; background: linear-gradient(#E4E4E4, var(--input)); color: #111; font-weight: 700; font-size: 14px; text-align: center; text-align-last: center; padding: 5px 4px; min-height: 30px; -webkit-appearance: none; appearance: none; cursor: pointer; }

/* ---------- layout ---------- */
.grid { display: flex; flex-direction: column; gap: 18px; }
.col { display: contents; }
@media (min-width: 980px) {
  .grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) 250px; gap: 26px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .grid .blk { order: 0 !important; }
}
.blk { min-width: 0; }
.title { background: linear-gradient(90deg, rgba(0,96,79,0) 0%, var(--bar-green) 18%, var(--bar-green) 82%, rgba(0,96,79,0) 100%); color: var(--white); font-weight: 700; text-align: center; font-size: 14px; padding: 5px 12px; letter-spacing: .03em; }
.note { font-size: 12px; margin: 8px 0 0; color: #DCE7E3; }

/* headline numbers (Excel B7:F8) */
.hl { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 14px; align-items: center; padding: 18px 4px 6px; text-align: center; }
.hl .cap { font-size: 13px; color: #E6EEEB; }
.hl .big { font-size: 34px; font-weight: 300; line-height: 1.15; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.hl .vr { background: #E6EEEB; height: 46px; opacity: .8; }

/* Pricing Summary (Excel Q5:R11) */
table.sum { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.sum caption { background: var(--bg-dark); text-align: center; font-size: 14px; padding: 7px; }
table.sum th, table.sum td { padding: 5px 6px; font-size: 12.5px; text-align: center; font-weight: 400; }
table.sum th { background: var(--bg-dark); color: var(--white); width: 52%; }
table.sum td { color: #111; font-variant-numeric: tabular-nums; }
table.sum tr:nth-child(odd) td { background: var(--cell-b); }
table.sum tr:nth-child(even) td { background: var(--cell-a); }

/* bar charts */
.chart { padding: 14px 0 0; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.bars { display: flex; align-items: flex-start; min-width: min-content; }
.bcol { flex: 1 1 0; max-width: 104px; min-width: 58px; padding: 0 9px; display: flex; flex-direction: column; }
.plot { height: var(--h, 150px); display: flex; align-items: flex-end; border-bottom: 1px solid var(--grey); }
.bar { width: 100%; display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 700; font-size: 12.5px; min-height: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lab { text-align: center; font-size: 11.5px; padding-top: 5px; min-height: 36px; line-height: 1.2; color: #F0F5F3; }
.comps .bcol { max-width: 92px; }

/* waterfall (Building Blocks) */
.wf { display: flex; padding: 14px 0 0; }
.wcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.wplot { position: relative; height: 190px; border-bottom: 1px solid var(--grey); }
.wbar { position: absolute; left: 12%; width: 76%; display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.wconn { position: absolute; left: 88%; width: 24%; border-top: 1px solid #B1BEBC; }
.wcol .lab { padding-top: 6px; }

/* what-if inputs (not part of the Excel dashboard; collapsed by default) */
details.asm { background: var(--bg-dark); padding: 10px 12px; }
details.asm summary { cursor: pointer; font-weight: 700; font-size: 13px; }
.asm .row { display: grid; gap: 4px; margin-top: 10px; font-size: 12px; color: #DCE7E3; }
.stepper { display: flex; align-items: center; background: var(--cell-a); color: #111; }
.stepper button { border: 0; background: var(--tan); color: var(--ink); width: 40px; height: 34px; font-size: 20px; font-weight: 700; cursor: pointer; }
.stepper output { flex: 1; text-align: center; font-weight: 700; }
.seg { display: flex; }
.seg button { flex: 1; border: 0; background: var(--cell-b); color: #111; padding: 7px 4px; cursor: pointer; font-weight: 600; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #fff; }
.asm .reset { margin-top: 10px; border: 0; background: none; color: var(--tan); text-decoration: underline; cursor: pointer; padding: 0; font-size: 12px; }
.empty { color: #DCE7E3; padding: 16px 4px; }
.foot { margin-top: 26px; text-align: center; font-size: 12px; color: #CFE0DA; }
.foot b { color: var(--tan); }
</style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <!-- Optional: put your own logo.png next to index.html and it appears here. -->
    <img id="logo" src="logo.png" alt="" onerror="this.remove()">
    <h1>DCM Pricer</h1>
    <div class="live" id="live" aria-live="polite"></div>
  </div>
</header>

<div class="page">
  <div class="sel">
    <label><span>Issuer</span><select id="selIssuer" aria-label="Issuer"></select></label>
    <label><span>Issuance Type</span><select id="selType" aria-label="Issuance type"></select></label>
    <label><span>Tenor</span><select id="selTenor" aria-label="Tenor"></select></label>
  </div>
  <main class="grid" id="app"></main>
  <p class="foot" id="foot"></p>
</div>

<script src="data.js"></script>
<script>
/* =====================================================================
   SETTINGS: edit these to change what the page shows.
   ===================================================================== */

// Where the page reads fresh numbers from (the data.js file the Excel macro uploads to GitHub).
// If this cannot be reached, the page falls back to the data.js that sits next to index.html.
const LIVE_URL = 'https://raw.githubusercontent.com/shahlamotb/DCM-Pricer/main/data.js';
const REFRESH_MINUTES = 5;      // how often the page checks for fresh numbers
const STALE_AFTER_MINUTES = 30; // show an amber warning if the numbers are older than this

// Issuers in the drop-down, in the same order as the Excel list.
const ISSUERS = ['PIF', 'Aramco', 'SECO', 'STC', 'Avilease', 'Maaden', 'SRC'];
// Which curve each issuer is priced off. KSA is the benchmark itself.
const BENCHMARK = { PIF: 'KSA', Aramco: 'KSA', SECO: 'KSA', STC: 'KSA', SRC: 'KSA', Avilease: 'PIF', Maaden: 'PIF' };
const TYPES = ['Bond', 'Sukuk'];
const TENORS = ['3', '5', '7', '10', '30'];
const ROUND_TO = 5;                          // Excel rounds each method to the nearest 5 bps
const BOND_BOX_ISSUERS = ['PIF', 'Aramco'];  // issuers that also show "FV from <Issuer> Bond Secondary Curve" for sukuk
const METHODS = [                            // [name in data.js, label on screen]
  ['Interpolation', 'Interpolation'],
  ['Extrapolation (Lower)', 'Extrapolation (Lower)'],
  ['Curve Extension', 'Curve Extension'],
  ['Curve Reduction', 'Curve Reduction']
];
/* ===================== end of settings ===================== */

let D = DATA;                 // the numbers currently on screen
let lastText = '';            // last live file seen (to skip needless redraws)
let live = { state: 'saved', fetchedAt: null };
const state = { issuer: 'Aramco', type: 'Sukuk', tenor: '5' };
const ov = { nip: null, pifDelta: null, pifMode: null };   // what-if overrides set on this phone

try {
  const s = JSON.parse(localStorage.getItem('dcm-pricer-sel') || 'null');
  if (s && ISSUERS.includes(s.issuer) && TYPES.includes(s.type) && TENORS.includes(s.tenor)) Object.assign(state, s);
} catch (e) {}

const $ = (id) => document.getElementById(id);
const r5 = (x) => Math.round(x / ROUND_TO + 1e-9) * ROUND_TO;
const bps = (x) => Math.round(x) + ' bps';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nip = () => (ov.nip != null ? ov.nip : (D.nip || 0));
const pifMode = () => (ov.pifMode != null ? ov.pifMode : (D.pifMode === 'Manual' ? 'Manual' : 'Secondaries'));
const pifDelta = () => (ov.pifDelta != null ? ov.pifDelta : (D.pifManualDelta || 0));

/* ---------- model logic (mirrors the formulas on the Excel Helper.Sheet and Pricer DB) ---------- */
const SPECIAL_30Y = ['SECO', 'STC', 'Maaden', 'SRC'];   // their 30Y sukuk is priced off their own long reference issue
const is30Special = (iss, ty, t) => ty === 'Sukuk' && t === '30' && SPECIAL_30Y.includes(iss);
const fixedFV = (iss, ty, t) => (D.fixed[iss] && D.fixed[iss][ty] && D.fixed[iss][ty][t] != null ? D.fixed[iss][ty][t] : null);
// As in Excel: the PIF "Manual" mode (KSA FV + manual delta) only applies while PIF itself is selected.
function fvOf(iss, ty, t) {
  if (iss === 'PIF' && state.issuer === 'PIF' && pifMode() === 'Manual') {
    const k = fixedFV('KSA', ty, t);
    return k == null ? null : k + pifDelta();
  }
  return fixedFV(iss, ty, t);
}
function calc() {
  const { issuer: iss, type: ty, tenor: t } = state;
  const fv = fvOf(iss, ty, t);
  if (fv == null) return null;
  const special = is30Special(iss, ty, t);
  let b = BENCHMARK[iss] || null, bName = b, bfv = null;
  if (special) {
    const blk = D.blocks[iss] && D.blocks[iss][ty] && D.blocks[iss][ty][t];
    const ref = blk && blk.refs && blk.refs[0];
    b = null; bName = ref ? ref[0] : null; bfv = ref ? r5(ref[2]) : null;
  } else if (b) bfv = fvOf(b, ty, t);
  const manual = iss === 'PIF' && pifMode() === 'Manual';
  const d95 = fv + nip();                                   // Helper.Sheet D95 (includes the New Issue Premium)
  const delta = bfv == null ? null : (manual ? pifDelta() : d95 - bfv);   // Helper.Sheet C95
  const offer = bfv == null ? d95 : bfv + delta;            // Pricer DB R9
  const deltaCap = special ? `Delta vs. ${iss} 10Y` : manual ? 'Delta vs. KSA (Manual)' : b ? `Delta vs. ${b}` : 'Delta';
  return { fv, special, b, bName, bfv, delta, offer, deltaCap, yld: D.ust[t] + offer / 100 };
}
const typesOf = (iss) => TYPES.filter((ty) => D.fixed[iss] && D.fixed[iss][ty]);
const tenorsOf = (iss, ty) => TENORS.filter((t) => fixedFV(iss, ty, t) != null);
function normalise() {
  if (!typesOf(state.issuer).includes(state.type)) state.type = typesOf(state.issuer)[0] || state.type;
  const ok = tenorsOf(state.issuer, state.type);
  if (ok.length && !ok.includes(state.tenor)) {
    const want = Number(state.tenor);
    state.tenor = ok.reduce((a, b) => (Math.abs(Number(b) - want) < Math.abs(Number(a) - want) ? b : a));
  }
}
// Raw method values for one curve: the issuer-sheet cells Excel reads (captured by the macro), else the all-tenor pricing blocks.
function rawMethods(iss, ty, t) {
  const m = D.methods && D.methods[iss] && D.methods[iss][ty] && D.methods[iss][ty][t];
  if (m) return m;
  const blk = D.blocks[iss] && D.blocks[iss][ty] && D.blocks[iss][ty][t];
  if (!blk) return null;
  const o = {};
  METHODS.forEach(([k]) => { o[k] = blk.methods[k] && blk.methods[k].value != null ? blk.methods[k].value : null; });
  return o;
}
// values: [[label, number|null]] -> bars with the average first (Excel: MROUND(AVERAGE(...),5)); null when no method has a value.
function chartRows(values) {
  const vals = values.filter(([, v]) => v != null);
  if (!vals.length) return null;
  const avg = r5(vals.reduce((s, [, v]) => s + v, 0) / vals.length);
  return [{ label: 'Avg. All Pricing Methods', value: avg, avg: true }].concat(vals.map(([label, value]) => ({ label, value })));
}
const R5 = (v) => (v == null ? null : r5(v));
// "FV from <issuer> <type> Secondary Curve": each method rounded to 5 bps.
function ownRows(iss, ty, t) {
  const raw = rawMethods(iss, ty, t); if (!raw) return null;
  return chartRows(METHODS.map(([k, lab]) => [lab, R5(raw[k])]));
}
// "FV from KSA / PIF Secondary Curve": the benchmark's methods (rounded) plus the delta.
function benchRows(b, ty, t, delta) {
  const raw = rawMethods(b, ty, t); if (!raw || delta == null) return null;
  return chartRows(METHODS.map(([k, lab]) => [lab, raw[k] == null ? null : r5(raw[k]) + delta]));
}
// "FV from <issuer> Bond Secondary Curve" (PIF / Aramco sukuk): bond methods less the Sukuk Discount.
function bondRows(iss, t) {
  const raw = rawMethods(iss, 'Bond', t); if (!raw) return null;
  const disc = D.sukukDiscount || 0;
  return chartRows(METHODS.map(([k, lab]) => [lab, raw[k] == null ? null : (k === 'Interpolation' ? r5(raw[k] - disc) : r5(raw[k]) - disc)]));
}
// Comps: the exact table Excel charts for the selected tenor. Falls back to the main issuers if that tenor was not captured yet.
function compsFor(iss, ty, t) {
  const byTenor = D.comps && D.comps[iss] && D.comps[iss][ty];
  if (!byTenor) return null;
  if (byTenor[t]) return { items: byTenor[t], full: true };
  const first = Object.keys(byTenor)[0];
  const items = byTenor[first].filter(([n]) => D.blocks[n]).map(([n]) => {
    const b = D.blocks[n][ty] && D.blocks[n][ty][t];
    return b && b.avg != null ? [n, b.avg] : null;
  }).filter(Boolean);
  if (!items.length) return null;
  items.sort((x, y) => (x[0] === iss ? -1 : y[0] === iss ? 1 : 0));
  return { items, full: false };
}

/* ---------- chart helpers (same look as the Excel charts) ---------- */
// Excel's automatic axis: starts at zero unless all bars are within ~17% of each other.
function axis(vals) {
  const mx = Math.max(...vals), mn = Math.min(...vals);
  let lo = 0;
  if (mx > 0 && mx !== mn && (mx - mn) / mx < 1 / 6) lo = Math.max(0, Math.floor((mn - (mx - mn) / 2) / 5) * 5);
  return { lo, hi: mx };
}
function bars(items, opts) {
  const h = opts.h || 150;
  const { lo, hi } = axis(items.map((i) => i.value));
  const pct = (v) => (hi === lo ? 100 : Math.max(2, ((v - lo) / (hi - lo)) * 100));
  const aria = items.map((i) => i.label.trim() + ' ' + bps(i.value)).join(', ');
  const cols = items.map((i) => `<div class="bcol"><div class="plot"><div class="bar" style="height:${pct(i.value).toFixed(1)}%;background:${i.color}">${bps(i.value)}</div></div><div class="lab">${esc(i.label.trim())}</div></div>`).join('');
  return `<div class="chart ${opts.cls || ''}" role="img" aria-label="${esc(aria)}" style="--h:${h}px"><div class="scroll"><div class="bars">${cols}</div></div></div>`;
}
// steps: [{label, value, kind:'total'|'delta', color}]
function waterfall(steps) {
  let cum = 0;
  const seq = steps.map((s) => {
    const o = s.kind === 'total' ? { ...s, from: 0, to: s.value } : { ...s, from: cum, to: cum + s.value };
    cum = o.to;
    return o;
  });
  const max = Math.max(...seq.map((s) => Math.max(s.from, s.to))) * 1.05 || 1;
  const aria = seq.map((s) => s.label + ' ' + bps(s.value)).join(', ');
  const cols = seq.map((s, i) => {
    const lo = Math.min(s.from, s.to), hi = Math.max(s.from, s.to);
    const conn = i < seq.length - 1 ? `<div class="wconn" style="bottom:${(s.to / max * 100).toFixed(2)}%"></div>` : '';
    const txt = s.kind === 'total' ? bps(s.value) : bps(s.value);
    return `<div class="wcol"><div class="wplot"><div class="wbar" style="bottom:${(lo / max * 100).toFixed(2)}%;height:${Math.max(((hi - lo) / max) * 100, 1.2).toFixed(2)}%;background:${s.color}">${txt}</div>${conn}</div><div class="lab">${esc(s.label)}</div></div>`;
  }).join('');
  return `<div class="wf" role="img" aria-label="${esc(aria)}">${cols}</div>`;
}
const section = (title, body, order, extra) => `<section class="blk" style="order:${order}"><div class="title">${esc(title)}</div>${extra || ''}${body}</section>`;

/* ---------- sections (same order and wording as the Excel dashboard) ---------- */
function build() {
  const { issuer: iss, type: ty, tenor: t } = state;
  const c = calc();
  const L = [], M = [], R = [];

  if (!c) {
    L.push(section(`${iss} ${t}Y ${ty} Offering Indicative Pricing [Including NIP]`, `<p class="empty">The model has no ${esc(iss)} ${ty.toLowerCase()} fair value at ${t}Y, so there is no quote for this selection.</p>`, 1));
    return { L, M, R };
  }
  const colour = (rows, avgColour) => rows.map((i) => ({ ...i, color: i.avg ? avgColour : 'var(--grey)' }));

  // headline (Excel B5:F8)
  const hl = `<div class="hl"><div><div class="cap">${esc(iss)} ${t}Y ${ty} FV</div><div class="big">T+${Math.round(c.offer)} bps</div></div><div class="vr"></div>` +
    (c.delta != null ? `<div><div class="cap">${esc(c.deltaCap)}</div><div class="big">${Math.round(c.delta)} bps</div></div>` : '<div></div>') + `</div>`;
  L.push(section(`${iss} ${t}Y ${ty} Offering Indicative Pricing [Including NIP]`, hl, 1));

  // FV from the issuer's own curve (Excel B11)
  const own = ownRows(iss, ty, t);
  if (own) L.push(section(`${iss} ${t}Y FV from ${iss} ${ty} Secondary Curve`, bars(colour(own, 'var(--gold)'), { h: 150 }), 4));

  // FV from the KSA / PIF curve (Excel B20) - not shown for 30Y sukuk
  if (c.b && !(ty === 'Sukuk' && t === '30')) {
    const ben = benchRows(c.b, ty, t, c.delta);
    if (ben) L.push(section(`${iss} ${t}Y FV from ${c.b} ${ty} Secondary Curve`, bars(colour(ben, 'var(--teal)'), { h: 170 }), 5));
  }

  // FV from the issuer's bond curve (Excel B31) - PIF / Aramco sukuk only, not at 30Y
  if (BOND_BOX_ISSUERS.includes(iss) && ty === 'Sukuk' && t !== '30') {
    const bd = bondRows(iss, t);
    if (bd) L.push(section(`${iss} ${t}Y FV from ${iss} Bond Secondary Curve`, bars(colour(bd, 'var(--teal)'), { h: 170 }), 6));
  }

  // building blocks (Excel J6:J7): benchmark FV -> delta -> issuer FV
  const steps = [];
  if (c.bfv != null) {
    steps.push({ label: c.special ? String(c.bName || '') : `${c.b} ${t}Y ${ty} FV`, value: c.bfv, kind: 'total', color: 'var(--teal)' });
    steps.push({ label: c.deltaCap, value: c.delta, kind: 'delta', color: 'var(--grey-light)' });
  }
  steps.push({ label: `${iss} ${t}Y ${ty} FV`, value: c.offer, kind: 'total', color: 'var(--gold)' });
  M.push(section(`${iss} ${t}Y Building Blocks`, waterfall(steps), 3, '<p class="note">*After normalizing the secondary curves</p>'));

  // comps (Excel J20)
  const cp = compsFor(iss, ty, t);
  if (cp) {
    const items = cp.items.map(([n, v], i) => ({ label: n, value: v, color: i === 0 ? 'var(--gold)' : 'var(--mint)' }));
    const note = cp.full ? '' : '<p class="note">Showing the main issuers only. Peer issuers for this tenor appear after the next full refresh from Excel.</p>';
    M.push(section('Comps Issuers', bars(items, { h: 190, cls: 'comps' }) + note, 7));
  }

  // Pricing Summary (Excel Q5:R11)
  const rows = [['Tenor', t + 'Y']];
  if (c.bfv != null) rows.push([`${c.special ? c.bName : c.b} FV`, bps(c.bfv)]);
  rows.push(['New Issue Premium', bps(nip())], [`${iss} FV`, bps(c.offer)]);
  if (c.delta != null) rows.push([c.special ? 'Delta' : c.deltaCap, bps(c.delta)]);
  rows.push(['Re-offer Yield', c.yld.toFixed(2) + '%']);
  R.push(`<section class="blk" style="order:2"><table class="sum"><caption>Pricing Summary</caption><tbody>${rows.map(([a, b]) => `<tr><th scope="row">${esc(a)}</th><td>${esc(b)}</td></tr>`).join('')}</tbody></table></section>`);

  // what-if inputs (not part of the Excel dashboard; collapsed by default)
  const stepper = (k, label, val) => `<div class="row"><label>${label}</label><div class="stepper"><button type="button" data-k="${k}" data-d="-5" aria-label="Decrease ${label}">−</button><output>${val}</output><button type="button" data-k="${k}" data-d="5" aria-label="Increase ${label}">+</button></div></div>`;
  const changed = ov.nip != null || ov.pifDelta != null || ov.pifMode != null;
  R.push(`<details class="asm" style="order:8" ${asmOpen ? 'open' : ''}><summary>What-if inputs</summary>
    ${stepper('nip', 'New Issue Premium (bps)', nip())}
    ${iss === 'PIF' ? `<div class="row"><label>PIF delta mode</label><div class="seg" role="group" aria-label="PIF delta mode"><button type="button" data-mode="Secondaries" aria-pressed="${pifMode() === 'Secondaries'}">Secondaries</button><button type="button" data-mode="Manual" aria-pressed="${pifMode() === 'Manual'}">Manual</button></div></div>` : ''}
    ${iss === 'PIF' && pifMode() === 'Manual' ? stepper('pifDelta', 'PIF delta vs. KSA (bps)', pifDelta()) : ''}
    ${changed ? '<button class="reset" type="button" id="reset">Reset to Excel values</button>' : ''}
  </details>`);
  return { L, M, R };
}
let asmOpen = false;

/* ---------- render ---------- */
function renderControls() {
  const tOk = typesOf(state.issuer), nOk = tenorsOf(state.issuer, state.type);
  $('selIssuer').innerHTML = ISSUERS.map((i) => `<option ${i === state.issuer ? 'selected' : ''}>${i}</option>`).join('');
  $('selType').innerHTML = TYPES.map((ty) => `<option ${ty === state.type ? 'selected' : ''} ${tOk.includes(ty) ? '' : 'disabled'}>${ty}</option>`).join('');
  $('selTenor').innerHTML = TENORS.map((x) => `<option value="${x}" ${x === state.tenor ? 'selected' : ''} ${nOk.includes(x) ? '' : 'disabled'}>${x}Y</option>`).join('');
}
function renderStatus() {
  const el = $('live');
  const when = D.asOf ? esc(D.asOf) : '';
  let cls = 'live', head = '', sub = '';
  const age = D.updatedUtc ? Math.round((Date.now() - Date.parse(D.updatedUtc)) / 60000) : null;
  if (live.state === 'ok' && (age == null || age <= STALE_AFTER_MINUTES)) {
    head = `<span class="dot"></span><b>Live</b> · updated ${when}`;
    sub = `Source: ${esc(D.source || 'Bloomberg')} · refreshes every ${REFRESH_MINUTES} min · <button type="button" id="rf">Refresh now</button>`;
  } else if (live.state === 'ok') {
    cls += ' stale';
    head = `<span class="dot"></span><b>Numbers are ${age} min old</b> · ${when}`;
    sub = `The Excel PC may be off · Source: ${esc(D.source || 'Bloomberg')} · <button type="button" id="rf">Refresh now</button>`;
  } else {
    cls += ' off';
    head = `<span class="dot"></span><b>Saved numbers</b> · ${when}`;
    sub = `Live feed not reachable · Source: ${esc(D.source || 'Bloomberg')} · <button type="button" id="rf">Try again</button>`;
  }
  el.className = cls;
  el.innerHTML = head + '<br>' + sub;
  $('rf').onclick = () => refresh();
  $('foot').innerHTML = `Source: <b>${esc(D.source || 'Bloomberg')}</b>${when ? ' · Data as of ' + when : ''}. Indicative pricing only.`;
}
function render() {
  const { L, M, R } = build();
  $('app').innerHTML = `<div class="col">${L.join('')}</div><div class="col">${M.join('')}</div><div class="col">${R.join('')}</div>`;
  document.querySelectorAll('.stepper button').forEach((b) => {
    b.onclick = () => {
      const k = b.dataset.k, d = Number(b.dataset.d), lim = { nip: [-50, 100], pifDelta: [-50, 100] }[k];
      const cur = k === 'nip' ? nip() : pifDelta();
      ov[k] = Math.max(lim[0], Math.min(lim[1], cur + d));
      render();
    };
  });
  document.querySelectorAll('.seg button').forEach((b) => { b.onclick = () => { ov.pifMode = b.dataset.mode; render(); }; });
  const rs = $('reset'); if (rs) rs.onclick = () => { ov.nip = ov.pifDelta = ov.pifMode = null; render(); };
  const det = document.querySelector('details.asm'); if (det) det.ontoggle = () => { asmOpen = det.open; };
}
function update() {
  normalise();
  try { localStorage.setItem('dcm-pricer-sel', JSON.stringify(state)); } catch (e) {}
  renderControls(); render(); renderStatus();
}
$('selIssuer').onchange = (e) => { state.issuer = e.target.value; update(); };
$('selType').onchange = (e) => { state.type = e.target.value; update(); };
$('selTenor').onchange = (e) => { state.tenor = e.target.value; update(); };

/* ---------- live refresh ---------- */
async function refresh() {
  try {
    const r = await fetch(LIVE_URL + '?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    const j = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
    if (!j.fixed || !j.blocks || !j.ust) throw new Error('unexpected file');
    live = { state: 'ok', fetchedAt: Date.now() };
    if (txt !== lastText) { lastText = txt; D = j; update(); } else renderStatus();
  } catch (e) {
    live.state = 'saved';
    renderStatus();
  }
}
setInterval(refresh, REFRESH_MINUTES * 60 * 1000);
setInterval(() => { if (live.state === 'ok') renderStatus(); }, 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!live.fetchedAt || Date.now() - live.fetchedAt > 60000)) refresh();
});

update();
refresh();
</script>
</body>
</html>
